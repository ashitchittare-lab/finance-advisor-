<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personal Finance Advisor Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#1c2540;--muted:#6b7a99;--line:#e3e9f4;--brand:#0fa678;--navy:#0b1b3a;--danger:#e5484d;--warn:#d98e04;--info:#2f6fed;--inp:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1226;--card:#131d38;--ink:#e8edf9;--muted:#93a1c0;--line:#243257;--inp:#0d1730;--navy:#070d1c}}
:root[data-theme="dark"]{--bg:#0a1226;--card:#131d38;--ink:#e8edf9;--muted:#93a1c0;--line:#243257;--inp:#0d1730;--navy:#070d1c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
[hidden]{display:none!important}
h2{margin:0 0 1rem;font-size:1.5rem}h4{margin:0 0 .75rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.1rem}
.grid{display:grid;gap:1rem}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat small{color:var(--muted)}.stat b{display:block;font-size:1.5rem;margin-top:.2rem}
input,select,button{font:inherit}
input,select{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:9px;background:var(--inp);color:var(--ink)}
label{font-size:.8rem;color:var(--muted);display:block;margin-bottom:.2rem}
.row{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end}
.btn{background:var(--brand);color:#fff;border:0;border-radius:9px;padding:.6rem 1rem;font-weight:600;cursor:pointer}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.o.on{border-color:var(--brand);color:var(--brand)}
.btn.x{background:transparent;color:var(--danger);padding:.3rem .5rem}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.hero{background:linear-gradient(140deg,#0b1b3a,#164a78);color:#fff;padding:3rem;display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:2.2rem;margin:.5rem 0}.hero p{opacity:.8;max-width:34ch;line-height:1.5}
.form{display:flex;align-items:center;justify-content:center;padding:2rem}.form>div{width:100%;max-width:360px}
.form form>*{margin-bottom:.9rem}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--navy);color:#fff;padding:1.2rem;display:flex;flex-direction:column;gap:.3rem;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:1.1rem;margin-bottom:1rem}
aside button{background:none;border:0;color:#aebbd6;text-align:left;padding:.65rem .8rem;border-radius:10px;cursor:pointer}
aside button:hover,aside button.on{background:rgba(255,255,255,.12);color:#fff}
aside .who{margin-top:auto;font-size:.8rem;color:#93a1c0;padding:.5rem .3rem}
main{padding:1.5rem;min-width:0}
table{width:100%;border-collapse:collapse}th,td{padding:.5rem;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:600;font-size:.8rem}
.r{text-align:right}.inc{color:var(--brand)}.exp{color:var(--danger)}.mut{color:var(--muted)}.sc{overflow-x:auto}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:.5rem 0}.bar i{display:block;height:100%;background:var(--brand)}
.al{border-left:4px solid var(--info);background:color-mix(in srgb,var(--info) 11%,transparent);padding:.65rem .8rem;border-radius:8px;margin-bottom:.6rem}
.al.danger{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 11%,transparent)}
.al.warning{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.al.success{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent)}
.score{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;margin:0 auto .6rem;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0)}
.score span{width:102px;height:102px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:2rem;font-weight:700}
#toast{position:fixed;bottom:calc(1rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:.6rem 1rem;border-radius:9px;z-index:9}
.flex{display:flex;gap:.5rem;flex-wrap:wrap}.sp{justify-content:space-between;align-items:center}
@media(max-width:800px){#auth{grid-template-columns:1fr}.hero{padding:2rem}
#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:.6rem;align-items:center}.brand,.who{display:none}aside button{white-space:nowrap}}
@media print{aside,.np{display:none!important}#app{display:block}}
</style></head>
<body>
<section id="auth" hidden>
 <div class="hero"><div class="brand">📈 FinAdvisor</div><h1>Know where your rupees go.</h1><p>Track income and spending, set budgets, reach goals, and get personalised advice from your AI financial advisor.</p></div>
 <div class="form"><div>
  <h2 id="atitle">Welcome back</h2>
  <div id="aerr" class="al danger" hidden></div>
  <form data-f="auth">
   <div id="nameBox" hidden><label>Full name</label><input name="name" maxlength="80"></div>
   <div><label>Email</label><input name="email" type="email" required></div>
   <div><label>Password</label><input name="password" type="password" required></div>
   <button class="btn" style="width:100%" id="abtn">Log in</button>
  </form>
  <p class="mut"><span id="aswap">New here? <a href="#" data-mode="register">Create an account</a></span><br><small>Demo: demo@example.com / demo1234</small></p>
 </div></div>
</section>
<div id="app" hidden>
 <aside id="nav"></aside>
 <main><div id="view"></div></main>
</div>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
const EXP=["Rent","Groceries","Dining","Transport","Bills","Shopping","Entertainment","Health","Education","Travel","Other"],
INC=["Salary","Freelance","Investments","Gift","Other"],NEEDS=["Rent","Groceries","Transport","Bills","Health","Education"],
SP={Groceries:[5000,8000],Dining:[2500,6000],Transport:[1500,3500],Bills:[2500,4000],Shopping:[2000,9000],Entertainment:[800,3000],Health:[500,2500]},
PAGES=[["dash","Dashboard"],["tx","Income & Expenses"],["bud","Budget Planner"],["goals","Goals & Savings"],["rep","Monthly Reports"],["adv","AI Advisor"]];
const $=s=>document.querySelector(s),INR=v=>"₹"+Math.round(v).toLocaleString("en-IN"),pad=n=>String(n).padStart(2,"0");
const ym=d=>d.getFullYear()+"-"+pad(d.getMonth()+1),iso=d=>ym(d)+"-"+pad(d.getDate());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shift=(m,n)=>{const[y,mo]=m.split("-").map(Number);return ym(new Date(y,mo-1+n,1))};
let DB;try{DB=JSON.parse(localStorage.getItem("fa_db"))}catch(e){}DB=DB||{users:[],data:{}};
const save=()=>{try{localStorage.setItem("fa_db",JSON.stringify(DB))}catch(e){}};
const me=()=>DB.data[DB.session];
async function hash(p,e){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(e+":"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
let page="dash",topic=null,repM=ym(new Date()),filt="",mode="login",charts=[];

async function seed(){
 if(DB.users.some(u=>u.email=="demo@example.com"))return;
 let s=7;const rnd=()=>(s=s*16807%2147483647)/2147483647,ri=(a,b)=>Math.floor(a+rnd()*(b-a+1));
 const t=new Date(),tx=[];let id=1;
 for(let k=0;k<3;k++){const dt=new Date(t.getFullYear(),t.getMonth()-k,1),last=k?28:Math.max(1,Math.min(28,t.getDate()));
  const add=(kd,c,a,n,day)=>tx.push({id:id++,k:kd,c,a,n,d:ym(dt)+"-"+pad(day||ri(1,last))});
  add("income","Salary",60000,"Monthly salary",1);if(k!=1)add("income","Freelance",ri(4000,9000),"Design project");
  add("expense","Rent",15000,"Monthly rent",1);
  for(const[c,[lo,hi]]of Object.entries(SP))add("expense",c,Math.round(ri(lo,hi)/10)*10,c+" spending")}
 const uid=1+DB.users.length;
 DB.users.push({id:uid,name:"Demo User",email:"demo@example.com",hash:await hash("demo1234","demo@example.com")});
 DB.data[uid]={tx,budgets:{Groceries:7000,Dining:4000,Shopping:5000,Entertainment:2500,Transport:3000},goals:[
  {id:1,n:"Emergency fund",t:150000,s:45000,dl:iso(new Date(t.getFullYear(),t.getMonth()+12,1))},
  {id:2,n:"Goa trip",t:40000,s:12000,dl:iso(new Date(t.getFullYear(),t.getMonth()+6,1))},
  {id:3,n:"New laptop",t:80000,s:20000,dl:""}]};
 save()}

function md(m){let inc=0,cats={};me().tx.filter(x=>x.d.startsWith(m)).forEach(x=>{if(x.k=="income")inc+=x.a;else cats[x.c]=(cats[x.c]||0)+x.a});
 return{inc,cats,spent:Object.values(cats).reduce((a,b)=>a+b,0)}}

function analyze(inc,cats,bud,goals){
 if(inc<=0)return{score:0,tips:[{l:"info",t:"No income recorded",x:"Add this month's income to unlock personalised advice."}]};
 const spent=Object.values(cats).reduce((a,b)=>a+b,0),sv=inc-spent,rate=sv/inc*100,tips=[],add=(l,t,x)=>tips.push({l,t,x});
 if(sv<0)add("danger","You're overspending",`Expenses exceed income by ${INR(-sv)}. Pause discretionary spending and review your top categories.`);
 else if(rate<20)add("warning",`Savings rate is ${Math.round(rate)}%`,`Aim for at least 20%: saving ${INR(inc*.2)} this month. You are ${INR(inc*.2-sv)} short.`);
 else add("success",`Great savings rate: ${Math.round(rate)}%`,`You are keeping ${INR(sv)} this month. Move it to savings or a goal before it gets spent.`);
 const needs=Object.entries(cats).filter(([k])=>NEEDS.includes(k)).reduce((a,[,v])=>a+v,0),wants=spent-needs;
 if(needs>inc*.5)add("warning","Needs above 50% of income",`Essentials cost ${INR(needs)} (${Math.round(needs/inc*100)}%). Review rent, bills and subscriptions.`);
 if(wants>inc*.3)add("warning","Wants above 30% of income",`Dining, shopping, travel and fun total ${INR(wants)}. Trim ${INR(wants-inc*.3)} to fit the 50/30/20 rule.`);
 const top=Object.keys(cats).sort((a,b)=>cats[b]-cats[a])[0];
 if(top&&cats[top]/spent>.35)add("info",`${top} is your biggest expense`,`It is ${Math.round(cats[top]/spent*100)}% of spending. A 10% cut saves ${INR(cats[top]*.1)}/month, or ${INR(cats[top]*1.2)}/year.`);
 for(const[c,lim]of Object.entries(bud)){const s=cats[c]||0;
  if(s>lim)add("danger","Over budget: "+c,`Spent ${INR(s)} against a limit of ${INR(lim)} (over by ${INR(s-lim)}).`);
  else if(s>=lim*.8)add("warning","Nearly at limit: "+c,`${INR(s)} of ${INR(lim)} used. ${INR(lim-s)} left this month.`)}
 const now=new Date();
 for(const g of goals){const rem=g.t-g.s;if(rem<=0||!g.dl)continue;const d=new Date(g.dl),mo=Math.max(1,(d.getFullYear()-now.getFullYear())*12+d.getMonth()-now.getMonth()),need=rem/mo,when=d.toLocaleDateString("en-IN",{month:"short",year:"numeric"});
  if(need>Math.max(sv,0))add("warning","Goal at risk: "+g.n,`Needs ${INR(need)}/month to finish by ${when}, but this month's surplus is ${INR(Math.max(sv,0))}.`);
  else add("info","On track: "+g.n,`Set an automatic transfer of ${INR(need)}/month to reach it by ${when}.`)}
 if(!goals.some(g=>/emergency/i.test(g.n)))add("info","Build an emergency fund",`Keep 6 months of expenses (${INR(spent*6)}) in a liquid account. Create a goal to track it.`);
 let score=40+Math.min(Math.max(rate,0),30)*1.5;if(!tips.some(t=>t.l=="danger"))score+=15;if(sv<0)score-=20;
 return{score:Math.max(0,Math.min(100,Math.floor(score))),tips}}

function ask(k,inc,cats){const spent=Object.values(cats).reduce((a,b)=>a+b,0),sv=inc-spent,top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,3);
 return{save:`Automate it: move ${INR(Math.max(inc*.2,0))} (20% of income) to savings on payday, before you spend. This month's surplus is ${INR(sv)}.`,
 cut:top.length?`Your biggest categories are ${top.map(([a,b])=>a+" ("+INR(b)+")").join(", ")}. Cutting each by 10% frees ${INR(top.reduce((a,[,v])=>a+v,0)*.1)} a month.`:"Add some expenses first.",
 emergency:`Aim for 3-6 months of expenses: ${INR(spent*3)} to ${INR(spent*6)}. Keep it in a savings account or liquid fund.`,
 invest:`After your emergency fund, consider a monthly SIP of about ${INR(Math.max(sv*.5,500))} in a diversified index fund for 5+ years. This is general education, not investment advice.`}[k]}

const alerts=t=>t.map(x=>`<div class="al ${x.l}"><b>${esc(x.t)}</b><br>${esc(x.x)}</div>`).join("");
const opts=a=>a.map(x=>`<option>${x}</option>`).join("");
const chart=(id,cfg)=>{const c=document.getElementById(id);if(c&&window.Chart)charts.push(new Chart(c,cfg))};
const yfmt={ticks:{callback:v=>"₹"+v.toLocaleString("en-IN")}};
const COL=["#0b5fa5","#0fa678","#e5484d","#f5a623","#4a90e2","#9b59b6","#1abc9c","#e67e22","#95a5a6","#34495e","#c0392b"];
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}

const V={
dash(){const m=ym(new Date()),{inc,cats,spent}=md(m),u=me(),{score,tips}=analyze(inc,cats,u.budgets,u.goals),saved=u.goals.reduce((a,g)=>a+g.s,0),
 tr=[-5,-4,-3,-2,-1,0].map(i=>{const mm=shift(m,i),d=md(mm);return[mm,d.inc,d.spent]}),rec=[...u.tx].sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).slice(0,6);
 setTimeout(()=>{chart("c1",{type:"bar",data:{labels:tr.map(x=>x[0]),datasets:[{label:"Income",data:tr.map(x=>x[1]),backgroundColor:"#0fa678"},{label:"Expenses",data:tr.map(x=>x[2]),backgroundColor:"#f0616d"}]},options:{scales:{y:yfmt}}});
  chart("c2",{type:"doughnut",data:{labels:Object.keys(cats),datasets:[{data:Object.values(cats),backgroundColor:COL,borderWidth:0}]},options:{plugins:{legend:{position:"right"}}}})});
 return`<h2>Hi ${esc(u.name?.split(" ")[0]||DB.users.find(x=>x.id==DB.session).name.split(" ")[0])}, here is your month</h2>
 <div class="grid g4">${[["Income",inc],["Expenses",spent],["Net savings",inc-spent],["Saved in goals",saved]].map(([l,v])=>`<div class="card stat"><small>${l}</small><b>${INR(v)}</b></div>`).join("")}</div>
 <div class="grid g2" style="margin-top:1rem"><div class="card"><h4>Income vs expenses (6 months)</h4><canvas id="c1" height="150"></canvas></div>
 <div class="card"><h4>Spending by category</h4>${spent?'<canvas id="c2" height="150"></canvas>':'<p class="mut">No expenses this month yet.</p>'}</div>
 <div class="card"><div class="flex sp"><h4>Advisor highlights</h4><a href="#" data-go="adv">Score ${score}/100</a></div>${alerts(tips.slice(0,3))}</div>
 <div class="card"><h4>Recent transactions</h4><table>${rec.map(t=>`<tr><td>${t.d.slice(5)}</td><td>${esc(t.c)}</td><td class="r ${t.k=="income"?"inc":"exp"}">${t.k=="income"?"+":"-"}${INR(t.a)}</td></tr>`).join("")}</table></div></div>`},
tx(){const rows=[...me().tx].filter(t=>!filt||t.k==filt).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).slice(0,200);
 return`<h2>Income & expenses</h2><form class="card row" data-f="tx" style="margin-bottom:1rem">
 <div><label>Type</label><select name="k" id="kind"><option value="expense">Expense</option><option value="income">Income</option></select></div>
 <div><label>Category</label><select name="c" id="cat">${opts(EXP)}</select></div>
 <div><label>Amount (₹)</label><input name="a" type="number" min="1" step="0.01" required></div>
 <div><label>Date</label><input name="d" type="date" value="${iso(new Date())}" max="${iso(new Date())}" required></div>
 <div><label>Note</label><input name="n" maxlength="200"></div><button class="btn">Add</button></form>
 <div class="card"><div class="flex" style="margin-bottom:.8rem">${[["","All"],["income","Income"],["expense","Expenses"]].map(([k,l])=>`<button class="btn o ${filt==k?"on":""}" data-filt="${k}">${l}</button>`).join("")}</div>
 <div class="sc"><table><tr><th>Date</th><th>Category</th><th>Note</th><th class="r">Amount</th><th></th></tr>${rows.map(t=>`<tr><td>${t.d}</td><td>${esc(t.c)}</td><td class="mut">${esc(t.n||"")}</td><td class="r ${t.k=="income"?"inc":"exp"}">${t.k=="income"?"+":"-"}${INR(t.a)}</td><td><button class="btn x" data-del="tx" data-id="${t.id}" aria-label="Delete">✕</button></td></tr>`).join("")||'<tr><td colspan="5" class="mut">No transactions yet. Add one above.</td></tr>'}</table></div></div>`},
bud(){const{cats}=md(ym(new Date())),b=me().budgets;
 return`<h2>Budget planner <small class="mut">this month</small></h2><form class="card row" data-f="bud" style="margin-bottom:1rem">
 <div><label>Category</label><select name="c">${opts(EXP)}</select></div><div><label>Monthly limit (₹)</label><input name="l" type="number" min="1" required></div><button class="btn">Save budget</button></form>
 <div class="grid g2">${Object.entries(b).map(([c,l])=>{const s=cats[c]||0,p=Math.round(s/l*100);return`<div class="card"><div class="flex sp"><b>${c}</b><button class="btn x" data-del="bud" data-id="${c}" aria-label="Delete">✕</button></div>
 <div class="bar"><i style="width:${Math.min(p,100)}%;background:${p>100?"var(--danger)":p>=80?"var(--warn)":"var(--brand)"}"></i></div>
 <small class="mut">${INR(s)} of ${INR(l)} (${p}%) · ${s<=l?INR(l-s)+" left":"over by "+INR(s-l)}</small></div>`}).join("")||'<p class="mut">No budgets yet. Set a limit above.</p>'}</div>`},
goals(){return`<h2>Goals & savings</h2><form class="card row" data-f="goal" style="margin-bottom:1rem">
 <div><label>Goal</label><input name="n" maxlength="80" required></div><div><label>Target (₹)</label><input name="t" type="number" min="1" required></div>
 <div><label>Saved so far (₹)</label><input name="s" type="number" min="0"></div><div><label>Deadline</label><input name="dl" type="date"></div><button class="btn">Create goal</button></form>
 <div class="grid g4" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${me().goals.map(g=>{const p=Math.min(100,Math.round(g.s/g.t*100));return`<div class="card"><div class="flex sp"><b>${esc(g.n)}</b><button class="btn x" data-del="goal" data-id="${g.id}" aria-label="Delete">✕</button></div>
 <div class="bar"><i style="width:${p}%"></i></div><small class="mut">${INR(g.s)} of ${INR(g.t)} (${p}%)${g.dl?" · by "+new Date(g.dl).toLocaleDateString("en-IN",{month:"short",year:"numeric"}):""}</small>
 <form data-f="gadd" data-id="${g.id}" class="flex" style="margin-top:.7rem;flex-wrap:nowrap"><input name="a" type="number" min="1" placeholder="Add savings (₹)" required><button class="btn">Add</button></form></div>`}).join("")||'<p class="mut">No goals yet. Create one above.</p>'}</div>`},
rep(){const{inc,cats,spent}=md(repM),b=me().budgets,rows=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
 setTimeout(()=>chart("c3",{type:"bar",data:{labels:rows.map(r=>r[0]),datasets:[{label:"Spent",data:rows.map(r=>r[1]),backgroundColor:"#0fa678"},{label:"Budget",data:rows.map(r=>b[r[0]]||0),backgroundColor:"#9fb0cf"}]},options:{scales:{y:yfmt}}}));
 return`<div class="flex sp" style="margin-bottom:1rem"><h2 style="margin:0">Monthly report: ${repM}</h2><form data-f="rep" class="flex np"><input type="month" name="m" value="${repM}" style="width:auto"><button class="btn">View</button><button type="button" class="btn o" data-print>Print</button></form></div>
 <div class="grid g4">${[["Income",INR(inc)],["Expenses",INR(spent)],["Net savings",INR(inc-spent)],["Savings rate",inc?Math.round((inc-spent)/inc*100)+"%":"-"]].map(([l,v])=>`<div class="card stat"><small>${l}</small><b>${v}</b></div>`).join("")}</div>
 <div class="grid g2" style="margin-top:1rem"><div class="card"><h4>Spending vs budget</h4>${rows.length?'<canvas id="c3" height="160"></canvas>':'<p class="mut">No expenses recorded for this month.</p>'}</div>
 <div class="card"><h4>Category breakdown</h4><table>${rows.map(([c,v])=>`<tr><td>${c}</td><td class="r">${INR(v)}</td><td class="r mut">${Math.round(v/spent*100)}%</td></tr>`).join("")}</table></div></div>`},
adv(){const{inc,cats}=md(ym(new Date())),u=me(),{score,tips}=analyze(inc,cats,u.budgets,u.goals),a=topic&&ask(topic,inc,cats);
 return`<h2>🤖 AI financial advisor</h2><div class="grid g2" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div><div class="card" style="text-align:center"><div class="score" style="--p:${score}"><span>${score}</span></div><b>Financial health score</b><p class="mut">Based on this month's savings rate and budget adherence.</p></div>

function render(){charts.forEach(c=>c.destroy());charts=[];Chart.defaults.color=getComputedStyle(document.body).getPropertyValue("--muted").trim()||"#6b7a99";
 $("#nav").innerHTML=`<div class="brand">📈 FinAdvisor</div>`+PAGES.map(([k,l])=>`<button class="${k==page?"on":""}" data-go="${k}">${l}</button>`).join("")+`<div class="who">${esc(DB.users.find(x=>x.id==DB.session).name)}<br>${esc(DB.users.find(x=>x.id==DB.session).email)}</div><button data-out>Log out</button>`;
 $("#view").innerHTML=V[page]()}
function boot(){const ok=DB.session&&DB.data[DB.session];$("#auth").hidden=!!ok;$("#app").hidden=!ok;if(ok)render()}
function setMode(m){mode=m;const r=m=="register";$("#nameBox").hidden=!r;$("#atitle").textContent=r?"Create your account":"Welcome back";$("#abtn").textContent=r?"Create account":"Log in";
 $("#aswap").innerHTML=r?'Already registered? <a href="#" data-mode="login">Log in</a>':'New here? <a href="#" data-mode="register">Create an account</a>';$("#aerr").hidden=true}

document.addEventListener("submit",async e=>{const f=e.target,k=f.dataset.f;if(!k)return;e.preventDefault();const d=Object.fromEntries(new FormData(f)),u=DB.session&&me();
 if(k=="auth"){const err=m=>{$("#aerr").textContent=m;$("#aerr").hidden=false},em=d.email.trim().toLowerCase();
  if(mode=="register"){if(!d.name.trim())return err("Enter your name.");if(d.password.length<8)return err("Password must be at least 8 characters.");if(DB.users.some(x=>x.email==em))return err("That email is already registered. Try logging in.");
   const id=Date.now();DB.users.push({id,name:d.name.trim(),email:em,hash:await hash(d.password,em)});DB.data[id]={tx:[],budgets:{},goals:[]};DB.session=id}
  else{const x=DB.users.find(x=>x.email==em);if(!x||x.hash!=await hash(d.password,em))return err("Incorrect email or password.");DB.session=x.id}
  save();f.reset();page="dash";return boot()}
 if(k=="tx"){const a=+d.a;if(!(a>0)||!(d.k=="income"?INC:EXP).includes(d.c)||!d.d)return toast("Check the form values.");u.tx.push({id:Date.now(),k:d.k,c:d.c,a,n:d.n,d:d.d});toast("Transaction added.")}
 if(k=="bud"){if(!(+d.l>0))return toast("Enter a positive limit.");u.budgets[d.c]=+d.l;toast("Budget saved for "+d.c+".")}
 if(k=="goal"){if(!d.n.trim()||!(+d.t>0))return toast("Give the goal a name and target.");u.goals.push({id:Date.now(),n:d.n.trim(),t:+d.t,s:+d.s||0,dl:d.dl});toast("Goal created.")}
 if(k=="gadd"){const g=u.goals.find(x=>x.id==f.dataset.id);if(!g||!(+d.a>0))return toast("Enter a positive amount.");g.s+=+d.a;toast("Added to "+g.n+".")}
 if(k=="rep"){if(d.m)repM=d.m}
 save();render()});
document.addEventListener("change",e=>{if(e.target.id=="kind")$("#cat").innerHTML=opts(e.target.value=="income"?INC:EXP)});
document.addEventListener("click",e=>{const t=e.target.closest("[data-go],[data-del],[data-filt],[data-ask],[data-out],[data-mode],[data-print]");if(!t)return;e.preventDefault();const D=t.dataset;
 if("mode"in D)return setMode(D.mode);if("print"in D)return print();
 if("out"in D){delete DB.session;save();return boot()}
 if("go"in D)page=D.go;if("filt"in D)filt=D.filt;if("ask"in D)topic=D.ask;
 if("del"in D&&confirm("Delete this item?")){const u=me();if(D.del=="tx")u.tx=u.tx.filter(x=>x.id!=D.id);if(D.del=="goal")u.goals=u.goals.filter(x=>x.id!=D.id);if(D.del=="bud")delete u.budgets[D.id];save()}
 render()});
seed().then(boot);
